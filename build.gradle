// groovy
 plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven { url "https://maven.terraformersmc.com/releases/" } // Mod menu
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	api "com.terraformersmc:modmenu:${project.mod_menu_version}"
}

def required = { name ->
	def v = project.findProperty(name)
	if (v == null) throw new GradleException("Missing property (${name}). Add it to `gradle.properties`.")
	return v
}

processResources {
	inputs.property "version", project.version
	inputs.property "loader_version", required('loader_version')
	inputs.property "minecraft_version", required('minecraft_version')
	inputs.property "mod_menu_version", required('mod_menu_version')

	filesMatching("fabric.mod.json") {
		expand(
				"version": project.version,
				"loader_version": required('loader_version'),
				"minecraft_version": required('minecraft_version'),
				"mod_menu_version": required('mod_menu_version')
		)
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}

publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
	}
	repositories {
		// publishing repositories
	}
}
